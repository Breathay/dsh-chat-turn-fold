# dsh-chat-turn-fold bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package:
# when the plugin is installed into a profile (through `dsh plugin --profile
# <name> add dsh-chat-turn-fold` or by adding the package to the profile's
# `dsh.profile.bundles` list), the profile boot merges THIS patch — a single
# `insert` of the host plugin row — exactly like a manual cordis.patch.yml
# mount line.
- insert:
    - id: chat-turn-fold
      name: 'dsh-chat-turn-fold'
